name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify the package imports
        run: python -c "import voiceauth; from voiceauth import cli, config, features, gmm_ubm"

      - name: Run test suite
        run: python -m pytest -q

  selftest:
    name: score-scale selftest
    # models/speaker_split.pkl was pickled on Windows and holds WindowsPath
    # objects, so it cannot be unpickled on Linux or macOS. The selftest loads
    # it and therefore only runs here; see "Portability" in the README.
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Reproduce the published score scale
        shell: pwsh
        run: python -m voiceauth.cli selftest
